# Desenvolvimento (só o banco; o Nest roda na sua máquina com "pnpm start:dev"):
#   docker compose up -d
#
# Stack completa em containers (migrations + API):
#   docker compose --profile app up -d --build

name: fintrack

services:
    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-fintrack}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintrack}
            POSTGRES_DB: ${POSTGRES_DB:-fintrack}
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    # Roda "prisma migrate deploy" uma vez e termina
    migrate:
        profiles: [app]
        build:
            context: ./backend
            target: migrate
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER:-fintrack}:${POSTGRES_PASSWORD:-fintrack}@postgres:5432/${POSTGRES_DB:-fintrack}
        depends_on:
            postgres:
                condition: service_healthy
        restart: 'no'

    api:
        profiles: [app]
        build:
            context: ./backend
            target: runner
        init: true
        restart: unless-stopped
        env_file: ./backend/.env
        environment:
            # sobrescreve o que estiver no backend/.env (lá o host é "localhost")
            NODE_ENV: production
            PORT: 3001
            DATABASE_URL: postgresql://${POSTGRES_USER:-fintrack}:${POSTGRES_PASSWORD:-fintrack}@postgres:5432/${POSTGRES_DB:-fintrack}
        ports:
            - '3001:3001'
        depends_on:
            migrate:
                condition: service_completed_successfully

    # web:
    #   profiles: [app]
    #   build:
    #     context: ./frontend
    #     args:
    #       NEXT_PUBLIC_API_URL: http://localhost:3001
    #   init: true
    #   restart: unless-stopped
    #   ports:
    #     - '3000:3000'
    #   depends_on:
    #     - api

    # Descomente quando entrar BullMQ/cache
    # redis:
    #   image: redis:7-alpine
    #   restart: unless-stopped
    #   ports:
    #     - '6379:6379'
